{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
  <div class="pa-flash {{ 'pa-flash--error' if cat == 'error' else 'pa-flash--ok' }} mb-3" role="{{ 'alert' if cat == 'error' else 'status' }}">
    <i class="fas {{ 'fa-exclamation-circle' if cat == 'error' else 'fa-check-circle' }} mr-2"></i>{{ msg }}
  </div>
  {% endfor %}
{% endwith %}
